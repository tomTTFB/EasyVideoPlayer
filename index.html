<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Easy Video Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=play_arrow,pause,volume_up" />
</head>

<body>

    <div id="upload-screen">
        <h1>Easy Video Player</h1>
        <p>Upload a video to play it.</p>
        <input type="file" id="file-input" accept="video/*">
    </div>
    
    <div id="player" hidden>
        <video id="video"></video>

        <canvas id="seek-canvas"></canvas>

        <div id="controls">
            <button id="play-btn">
                <span id="play" class="material-symbols-outlined">play_arrow</span>
                <span id="pause" class="material-symbols-outlined">pause</span>
            </button>

            <div id="volume-panel">

                <button id="volume-btn">
                    <span class="material-symbols-outlined">volume_up</span>
                    <span id="volume-text">100%</span>
                </button>

                <div id="volume-popup" hidden>
                    <p id="volume-timer">10.0s</p>
                    <button id="click-target">CLICK!</button>
                    <p id="volume-label">0 Clicks</p>
                </div>
            </div>
        </div>

        
    </div>

    <script src="player.js"></script>
    <script src="seekbar.js"></script>
    <script src="volume.js"></script>
</body>
</html>
